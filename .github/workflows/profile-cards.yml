name: Update profile cards

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-cards.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # STATS_TOKEN is a read-only fine-grained token, so the cards can count
      # private repos. They only ever show totals and language percentages.
      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Enderburstz&show_icons=true&count_private=true&include_all_commits=true&hide_rank=true&hide_border=true&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN }}
      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Enderburstz&show_icons=true&count_private=true&include_all_commits=true&hide_rank=true&hide_border=true
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Enderburstz&layout=compact&langs_count=8&hide_border=true&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN }}
      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Enderburstz&layout=compact&langs_count=8&hide_border=true
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: PocketGPG card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Enderburstz&repo=PocketGPG&hide_border=true&theme=github_dark
          path: profile/pin-pocketgpg-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: PocketGPG card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Enderburstz&repo=PocketGPG&hide_border=true
          path: profile/pin-pocketgpg-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Enderburstz
          outputs: |
            profile/snake-light.svg
            profile/snake-dark.svg?palette=github-dark
          github_token: ${{ secrets.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
